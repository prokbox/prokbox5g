{{- if eq .Type "alert" -}}
{{- $t := dict "note" "Note" "tip" "Tip" "important" "Important" "warning" "Warning" "caution" "Careful" -}}
<div class="callout callout-{{ .AlertType }}" role="note">
  <p class="callout-title">{{ with .AlertTitle }}{{ . }}{{ else }}{{ index $t .AlertType | default (title .AlertType) }}{{ end }}</p>
  {{ .Text }}
</div>
{{- else -}}
<blockquote>{{ .Text }}</blockquote>
{{- end -}}
