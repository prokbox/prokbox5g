{{ $guide := site.GetPage "/guide" }}
<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ "" | relURL }}">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="4" width="36" height="56" rx="7"/><rect class="scr" x="19" y="10" width="26" height="19" rx="2"/><circle cx="32" cy="44" r="10"/><circle class="hub" cx="32" cy="44" r="3.5"/></svg>
      <span>ProkBox<b>5g</b></span>
    </a>
    <nav class="top-nav" aria-label="Main">
      {{ with $guide }}<a href="{{ .RelPermalink }}"{{ if or (eq $.Section "guide") }} aria-current="true"{{ end }}>Guide</a>{{ end }}
      {{ with site.GetPage "/releases" }}<a href="{{ .RelPermalink }}"{{ if eq $.Section "releases" }} aria-current="true"{{ end }}>Releases</a>{{ end }}
      <a class="nav-source" href="{{ site.Params.repo }}">Source</a>
    </nav>
    <button class="search-open" type="button" aria-label="Search" data-search-open hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Search</span>
    </button>
  </div>
</header>
