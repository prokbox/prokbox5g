# The ProkBox5g site and user guide (docs/release-plan.md section 3.4).
# Content lives in docs/user/ (Markdown, shared with the PDF); this folder
# holds only the layouts and the stylesheet. Build: scripts/docs_build.sh.
baseURL = "https://prokbox.github.io/prokbox5g/"
title = "ProkBox5g"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
enableRobotsTXT = false

[params]
  description = "Free, open-source firmware for the iPod Video (5th generation and 5.5)."
  # a dev default only: the real version comes from scripts/version.sh via scripts/docs_build.sh;
  # release_docs.py refuses a hand-typed release number here
  version = "dev"
  repo = "https://github.com/prokbox/prokbox5g"
  releases = "https://github.com/prokbox/prokbox5g/releases"
  contact = "prokbox.project@gmail.com"
  pdf = "downloads/ProkBox5g-User-Guide.pdf"

[module]
  [[module.mounts]]
    source = "../docs/user"
    target = "content"
    files = ["! images/**", "! README.md"]
  # the developer reference (docs/manual/), as the Developers section
  [[module.mounts]]
    source = "../docs/manual"
    target = "content/developers"
  [[module.mounts]]
    source = "../docs/user/images"
    target = "static/images"
  [[module.mounts]]
    source = "static"
    target = "static"

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    autoHeadingID = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputFormats]
  [outputFormats.print]
    mediaType = "text/html"
    baseName = "index"
    path = "print"
    isHTML = true
    permalinkable = false
