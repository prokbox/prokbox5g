# ProkBox5g release build (docs/release-plan.md section 3.3, docs/legal.md L4/L5).
#
# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N for post-1.0 feature betas) builds
# every release asset from that tag and publishes them together on one
# GitHub release, as a draft for the owner to review and publish:
#   ProkBox5g-<ver>-{stock,modded}-{flash,hdd}-{64,32}MB.zip   firmware (8 zips)
#   ProkBox5g-<ver>-source.tar.gz                        corresponding source
#   ProkBox5g-<ver>-User-Guide.pdf                       the user guide
#   ProkBox5g-<ver>-ipodpatcher-{macos-universal,linux-x86_64,windows-x86_64.exe}
#                                                        the install tool (utils/ipodpatcher, GPL)
#   SHA256SUMS
# The draft is NOT published by CI. Owner's release gate (2026-10-26): the
# draft's zip is checksum-compared with a local build of the same commit,
# installed on the owner's iPod (backup first, owner's go), and passes the
# ~10 min release smoke checklist; only then is the draft published.
# 0.x tags are marked pre-release (owner, 2026-10-26: 0.8 is "the
# pre-release"; "beta" is only for new features after 1.0).
#
# Docs ship with every release: the check job refuses a tag whose release
# notes are missing or still draft, whose site version or changelog disagree
# (scripts/release_docs.py); the guide job builds the site and the PDF for the
# tag (docs_build.sh --release); the draft's body is the notes plus the
# changelog fragment. Publishing the release triggers pages.yml (release:
# published), which rebuilds and deploys the site from the tag.
#
# Toolchain: Linux runners inside the pinned release container
# (ci/toolchain/Dockerfile: GCC 16.2.0 and binutils 2.47 from checksummed
# GNU tarballs, host tools from a fixed Debian snapshot), pulled by digest
# from a private package (env TOOLCHAIN_IMAGE below); CI never builds GCC.
# The owner's Linux host has the same image for the local side of
# scripts/release_compare.py. The BCM2722
# images are prebuilt in bcmfw/video/ (their sources are in bcmfw/ and ship
# in the source tarball). The zips themselves: scripts/release_build.sh.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.8.0"
        required: true

permissions:
  contents: write
  packages: read

env:
  # The pinned release toolchain and docs images (ci/toolchain/Dockerfile,
  # ci/docs/Dockerfile), built once on the owner's Linux host and kept as
  # PRIVATE packages linked to this repository: CI downloads them, it never
  # builds GCC. Rebuild and re-push (and update these digests) only when a
  # Dockerfile changes.
  TOOLCHAIN_IMAGE: ghcr.io/prokbox/prokbox5g-toolchain@sha256:ce11db75441b3d6a494d25883547ccc38b8d1267b8170de2909a36b8db47a692
  DOCS_IMAGE: ghcr.io/prokbox/prokbox5g-docs@sha256:261c0936fc83e235b10a9ddbb0b59cc3d48489474a7b2902396a018a51a2e44a

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
      base: ${{ steps.v.outputs.base }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$' \
            || { echo "::error::tag $tag is not vX.Y.Z, vX.Y.Z-alpha[.N], vX.Y.Z-beta.N or vX.Y.Z-rc.N"; exit 1; }
          ver="${tag#v}"
          # release notes come from the base version's page: an RC (vX.Y.Z-rc.N,
          # staged and smoke-tested before the cut) uses docs/user/releases/X.Y.Z.md
          base="${ver%%-rc*}"
          pre=false
          case "$ver" in 0.*|*-alpha*|*-beta*|*-rc*) pre=true ;; esac
          { echo "tag=$tag"; echo "ver=$ver"; echo "base=$base"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      - name: docs are part of the release (scripts/release_docs.py)
        run: |
          # notes published (not draft), no hand-typed site version, changelog and its
          # fragment; an RC may still carry draft notes. The history-based freshness
          # check ran privately before the export (release_tree.py --version).
          rc=""; case "${{ steps.v.outputs.ver }}" in *-rc*) rc="--rc" ;; esac
          python3 scripts/release_docs.py check "${{ steps.v.outputs.base }}" $rc
      - name: release text checks
        run: |
          ver="${{ steps.v.outputs.ver }}"
          # The version is derived from the tag (scripts/version.sh, docs/process.md
          # "Versions"): the checked-out commit must be exactly at the tag the run
          # was started for, and nothing may type a version by hand.
          got=$(scripts/version.sh --tag-only) \
            || { echo "::error::scripts/version.sh --tag-only fails: the checkout is not exactly at a release tag"; exit 1; }
          [ "$got" = "$ver" ] \
            || { echo "::error::tag says $ver but scripts/version.sh says $got"; exit 1; }
          # About and the first-boot notice show "ProkBox5g <ver>" (docs/legal.md
          # section 1); the language string is the template, never a literal version.
          grep -q ': "ProkBox5g %s"' apps/lang/english.lang \
            || { echo '::error::apps/lang/english.lang LANG_IPODUI_VERSION_STRING is not the template "ProkBox5g %s"'; exit 1; }
          [ -f "docs/user/releases/${{ steps.v.outputs.base }}.md" ] \
            || { echo "::error::no release notes docs/user/releases/${{ steps.v.outputs.base }}.md for tag $ver"; exit 1; }
          # GPL v2 section 2(c): the device must name the real source address (docs/legal.md L4).
          if grep -q 'prokbox\.example' apps/lang/english.lang; then
            echo "::error::LANG_IPODUI_NOTICE_URL still holds the placeholder address"; exit 1
          fi

  firmware:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        ram: [64, 32]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - name: the pinned toolchain image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$TOOLCHAIN_IMAGE"
      - name: build the four zips
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/w -w /w \
            -e RELEASE_BUILD=1 \
            "$TOOLCHAIN_IMAGE" scripts/release_build.sh ${{ matrix.ram }} out
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.ram }}
          path: out/*.zip
          if-no-files-found: error

  guide:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - name: the pinned docs image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$DOCS_IMAGE"
      - name: the user guide (PDF), same source as the site
        run: |
          ver="${{ needs.check.outputs.ver }}"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/w -w /w "$DOCS_IMAGE" \
            sh scripts/docs_build.sh --release --pdf --version "$ver" --out /w/_site
          mkdir -p out && cp _site/downloads/ProkBox5g-User-Guide.pdf "out/ProkBox5g-$ver-User-Guide.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: guide
          path: out/*.pdf
          if-no-files-found: error

  ipodpatcher:
    # The install tool (utils/ipodpatcher, Rockbox's GPL code, unmodified) as
    # prebuilt assets, so users need not compile it. Small C tool, no toolchain
    # build. Built WITHOUT embedded bootloaders (no BOOTOBJS): it patches in
    # whatever file is given to -a, so it pairs with the zip's
    # bootloader-ipodvideo.ipod. Runner images are pinned by version; the
    # mingw package comes from the pinned runner's apt index.
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # ARCHFLAGS reaches make through the step's environment, never through
          # eval: eval strips the quotes and re-splits the words, so "-arch arm64
          # -arch x86_64" became separate words (make's "invalid option -- a" on
          # the rc.7 staging run, "arm64: command not found" on the first 0.8.0 run)
          - { os: macos-15,     name: macos-universal,   bin: ipodpatcher,     archflags: "-arch arm64 -arch x86_64", make: "" }
          - { os: ubuntu-24.04, name: linux-x86_64,      bin: ipodpatcher,     make: "LDFLAGS=-static" }
          - { os: ubuntu-24.04, name: windows-x86_64.exe, bin: ipodpatcher.exe, make: "CROSS=x86_64-w64-mingw32- WINDRES=windres LDFLAGS=-static ipodpatcher.exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - name: mingw-w64 (Windows build only)
        if: ${{ endsWith(matrix.name, '.exe') }}
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - name: build
        env:
          ARCHFLAGS: ${{ matrix.archflags }}
        run: |
          make -C utils/ipodpatcher ${{ matrix.make }}
          mkdir -p out
          cp "utils/ipodpatcher/${{ matrix.bin }}" "out/ProkBox5g-${{ needs.check.outputs.ver }}-ipodpatcher-${{ matrix.name }}"
          file "out/ProkBox5g-${{ needs.check.outputs.ver }}-ipodpatcher-${{ matrix.name }}"
      - name: smoke (host-runnable builds; no device access)
        if: ${{ !endsWith(matrix.name, '.exe') }}
        run: |
          "out/ProkBox5g-${{ needs.check.outputs.ver }}-ipodpatcher-${{ matrix.name }}" --help 2>&1 | grep -q -- '--add-bootloader '
      - uses: actions/upload-artifact@v4
        with:
          name: ipodpatcher-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [check, firmware, guide, ipodpatcher]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: source tarball and checksums
        run: |
          ver="${{ needs.check.outputs.ver }}"
          # a VERSION file in the tarball: it has no .git for scripts/version.sh
          mkdir -p ver && echo "$ver" > ver/VERSION
          git archive --format=tar.gz --prefix="ProkBox5g-$ver/" --add-file=ver/VERSION \
            -o "out/ProkBox5g-$ver-source.tar.gz" "${{ needs.check.outputs.tag }}"
          chmod +x out/ProkBox5g-*-ipodpatcher-* # artifact transfer drops the mode
          cd out && sha256sum *.zip *.pdf *.tar.gz ProkBox5g-*-ipodpatcher-* > SHA256SUMS && cat SHA256SUMS
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.check.outputs.tag }}"
          ver="${{ needs.check.outputs.ver }}"
          pre=""; [ "${{ needs.check.outputs.prerelease }}" = true ] && pre="--prerelease"
          notes=release-notes.md
          src="docs/user/releases/${{ needs.check.outputs.base }}.md"
          if [ -f "$src" ]; then
            # the release notes page of the site, without its front matter
            awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {fm=0; next} !fm' "$src" \
              | sed -e "s#](\.\./guide/#](https://github.com/${{ github.repository }}/blob/$tag/docs/user/guide/#g" \
                    -e "s#](\.\./images/#](https://raw.githubusercontent.com/${{ github.repository }}/$tag/docs/user/images/#g" > "$notes"
          else
            echo "::error::no release notes: $src"; exit 1
          fi
          # what changed, built from the project history (scripts/changelog.py)
          frag="docs/changelog/${{ needs.check.outputs.base }}.md"
          [ -s "$frag" ] || { echo "::error::no changelog fragment: $frag"; exit 1; }
          { printf '\n'; cat "$frag"; cat <<'NOTE'

          ---
          ProkBox5g is not Apple software. It is an independent, community-driven fork of Rockbox, and Apple Inc. has not made, approved, endorsed or supported it in any way. It contains no Apple software. iPod is a trademark of Apple Inc.
          NOTE
          } >> "$notes"
          # Binaries and source go up together, never binaries alone (GPL v2 section 3(a)).
          gh release create "$tag" out/* --draft $pre \
            --title "ProkBox5g $ver" --notes-file "$notes" --verify-tag
